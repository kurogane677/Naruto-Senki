name: Build

# push tag v*      -> build + GitHub Release
# workflow_dispatch -> build only (APKs as run artifacts), from any branch
# Android only for now; the Win64 job was removed (see git history to restore it)
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  AXMOL_VERSION: v2.11.5 # Latest version from 31 Oct 2026
  AX_ROOT: ${{ github.workspace }}/axmol

jobs:
  android:
    runs-on: windows-latest
    # KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD live in the "release" environment
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Clone Axmol
        run: git clone --depth 1 --branch $env:AXMOL_VERSION https://github.com/axmolengine/axmol.git $env:AX_ROOT

      - name: Cache Android SDK/NDK + Axmol tools
        uses: actions/cache@v6
        with:
          path: |
            axmol/tools/external
            axmol/cache
            ~/.gradle/caches
          key: axmol-android-${{ env.AXMOL_VERSION }}

      # setup.ps1 mengambil NDK r23d lewat endpoint androidbuildinternal yang sekarang
      # membalas 501. Unduh dari link raw ci.android.com ke cache Axmol; 1kiss memakai
      # file yang sudah ada di cache dan tidak mengunduh ulang.
      - name: Download NDK r23d
        shell: pwsh
        run: |
          $zip = "$env:AX_ROOT/cache/android-ndk-12186248-windows-x86_64.zip"
          if (!(Test-Path $zip)) {
            New-Item -ItemType Directory -Force "$env:AX_ROOT/cache" | Out-Null
            curl.exe -fsSL --retry 5 -o $zip "https://ci.android.com/builds/submitted/12186248/win64/latest/raw/android-ndk-12186248-windows-x86_64.zip"
            if ($LASTEXITCODE -ne 0) { throw "NDK download failed" }
          }

      - name: Decode keystore
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/release.jks",
            [Convert]::FromBase64String("${{ secrets.KEYSTORE_BASE64 }}"))

      # Two signed APKs from the same build:
      #   *-android.apk        targetSdk 36 (default)
      #   *-android-sdk29.apk  targetSdk 29: phone APK editors can repack it, because
      #                        Android only demands an uncompressed resources.arsc from 30+
      - name: Build APKs (release, signed)
        shell: pwsh
        run: |
          & "$env:AX_ROOT/setup.ps1"
          $sign = "-PKEY_STORE_FILE=$env:RUNNER_TEMP/release.jks,-PKEY_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }},-PKEY_ALIAS=${{ secrets.KEY_ALIAS }},-PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          $name = "${{ github.ref_name }}" -replace '[\/]', '-'
          $apk = "proj.android/app/build/outputs/apk/release/NarutoSenki-release.apk"
          New-Item -ItemType Directory -Force dist | Out-Null

          & "$env:AX_ROOT/tools/cmdline/axmol.ps1" build -p android -a arm64 -xc $sign
          if (!(Test-Path $apk)) { throw "APK (targetSdk 36) tidak terbentuk" }
          Move-Item $apk "dist/NarutoSenki-$name-android.apk"

          & "$env:AX_ROOT/tools/cmdline/axmol.ps1" build -p android -a arm64 -xc "$sign,-PNS_TARGET_SDK=29"
          if (!(Test-Path $apk)) { throw "APK (targetSdk 29) tidak terbentuk" }
          Move-Item $apk "dist/NarutoSenki-$name-android-sdk29.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: NarutoSenki-android
          path: dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            NarutoSenki-android/*.apk
